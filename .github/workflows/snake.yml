name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Cyberexpert999
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00ff9c&color_dots=0d1117,102a43,155e75,00b8d9,00ff9c
            dist/github-contribution-grid-snake-dark.svg?color_snake=00ff9c&color_dots=0d1117,102a43,155e75,00b8d9,00ff9c

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
